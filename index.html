<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BuddyApp">
<meta name="theme-color" content="#c8622d">
<title>BuddyApp</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #faf6f1; --surface: #ffffff; --surface-2: #f3ece4; --text: #2b211b; --muted: #7a6a5e;
    --accent: #c8622d; --accent-text: #ffffff; --accent-soft: #f7e3d6; --ok: #2f8a5b; --ok-soft: #dcf0e4;
    --border: #e6dcd2; --shadow: 0 1px 3px rgba(60,40,20,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1714; --surface: #26201c; --surface-2: #322a24; --text: #f2e9e1; --muted: #b3a294;
      --accent: #e47b43; --accent-text: #1c1714; --accent-soft: #4a3020; --ok: #5cc28c; --ok-soft: #1f3a2b;
      --border: #3b322b; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(88px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); margin: 10px 0; }
  input, select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%; }
  label { display: block; font-size: .9rem; color: var(--muted); margin: 10px 0 4px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 10px 14px; }
  .btn { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn.ghost { background: var(--surface-2); color: var(--text); font-weight: 500; }
  .btn.small { padding: 6px 10px; font-size: .85rem; }
  .btn:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .tabs { display: flex; gap: 6px; margin: 12px 0; }
  .tabs button { flex: 1; background: var(--surface-2); color: var(--text); }
  .tabs button.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .error { color: #c0392b; font-size: .9rem; margin-top: 8px; }
  .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .level { text-align: right; font-size: .85rem; color: var(--muted); }
  .level b { color: var(--text); font-size: 1rem; }
  .xpbar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .xpbar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .habit { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
  .habit:first-child { border-top: 0; }
  .check { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 2px solid var(--border); background: var(--surface);
    font-size: 1.4rem; display: grid; place-items: center; padding: 0; color: var(--ok); }
  .check.done { background: var(--ok-soft); border-color: var(--ok); }
  .habit-name { font-weight: 600; overflow-wrap: anywhere; }
  .dots { display: flex; gap: 4px; margin-top: 4px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--surface-2); font-size: .6rem; display: grid; place-items: center; color: var(--muted); }
  .dot.on { background: var(--ok); color: #fff; }
  .dot.today { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pill { display: inline-block; font-size: .8rem; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin-left: 4px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .nudge { background: var(--accent-soft); border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { background: var(--surface-2); color: var(--text); border-radius: 99px; padding: 8px 12px; font-size: .9rem; }
  .code { font: 600 1.6rem ui-monospace, Consolas, monospace; letter-spacing: .15em; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
  nav div { display: flex; width: 100%; max-width: 560px; }
  nav button { flex: 1; background: none; color: var(--muted); padding: 10px 4px 12px; font-size: .8rem; border-radius: 0; }
  nav button span { display: block; font-size: 1.3rem; }
  nav button.active { color: var(--accent); font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<main id="app"><p class="muted">Lädt …</p></main>
<nav id="nav" hidden></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
